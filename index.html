:root{--bg:#f7f5ee;--card:#fff;--ink:#1d2a22;--mut:#5b6760;--acc:#0e5a33;--gd:#08331d;--gold:#c9a24b;--gl:#e3c06a;--red:#d21034;--line:#e4dfcf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1511;--card:#14211a;--ink:#eef2ee;--mut:#a9b8ae;--acc:#7fd1a1;--line:#24362b}}
:root[data-theme="dark"]{--bg:#0c1511;--card:#14211a;--ink:#eef2ee;--mut:#a9b8ae;--acc:#7fd1a1;--line:#24362b}
html{background:#08331d;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7;padding-bottom:84px}
img{max-width:100%}
.wrap{max-width:880px;margin:0 auto;padding:0 18px}
section{padding:44px 0}
h2{font:800 28px/1.3 Cairo,sans-serif;color:var(--acc);margin:0 0 6px}
h2+.sub{color:var(--mut);margin:0 0 22px}
.hero{background:radial-gradient(circle at 70% 0,#12663a,#08331d 70%);color:#fff;text-align:center;padding:26px 0 40px;position:relative}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--red),var(--gl),var(--red))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.logo{width:68px;height:68px;border-radius:50%;border:2px dashed var(--gl);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.2;color:var(--gl);padding:5px;flex:none;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.party{font-weight:700;font-size:18px;flex:1}
.tbtn{background:transparent;border:1px solid var(--gl);color:var(--gl);border-radius:20px;padding:4px 12px;font:600 13px Cairo,sans-serif;cursor:pointer;min-height:44px}
.photo{width:176px;height:176px;border-radius:50%;border:5px solid var(--gl);object-fit:cover;background:#fff;margin:6px auto 14px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.name{font:700 54px/1.15 Amiri,serif;color:var(--gl);margin:0}
.role{font-weight:700;font-size:20px}
.area{color:var(--gl);font-weight:600}
.nums{display:flex;gap:12px;justify-content:center;margin:20px 0 14px}
.num{border-radius:14px;padding:8px 22px;min-width:132px;border:2px solid var(--gl)}
.num small{display:block;font-weight:700;font-size:14px}
.num b{font:800 52px/1 Cairo,sans-serif}
.n1{background:#fff;color:var(--gd)}.n2{background:var(--gl);color:var(--gd)}
.slogan{font-weight:600;font-size:17px;margin:4px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font:700 16px Cairo,sans-serif;text-decoration:none;border:2px solid var(--gl);background:var(--gl);color:var(--gd);cursor:pointer}
.btn.alt{background:transparent;color:#fff}
.btn svg,.sbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ico{width:46px;height:46px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.ico svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .ico svg{stroke:#0c1511}
.card h3{margin:0 0 4px;font-size:19px;color:var(--ink)}
.card p{margin:0;color:var(--mut)}
.gal{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.gal button{padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:linear-gradient(135deg,#0e5a33,#08331d);color:var(--gl);font:600 14px Cairo,sans-serif;cursor:pointer}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.lb.on{display:flex}.lb img{max-height:90vh;border-radius:8px}
.art img{width:100%;border-radius:10px;margin-bottom:10px}
.art time{color:var(--mut);font-size:13px}
.art .more{display:none;margin-top:8px}.art.open .more{display:block}
.art button{background:none;border:0;color:var(--acc);font:700 15px Cairo,sans-serif;cursor:pointer;padding:6px 0;min-height:44px}
.cg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cg a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:12px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700}
:root[data-theme="dark"] .cg a{color:#0c1511}
.cg a.todo{opacity:.45}
.addr{margin-top:14px}
.ballot{background:#fff;color:#1d2a22;border:2px solid #999;border-radius:8px;overflow:hidden;max-width:420px;margin:0 auto 18px}
.ballot .h{background:#eee;padding:8px 14px;font-weight:700;text-align:center;border-bottom:2px solid #999}
.ballot .r{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #ccc}
.ballot .r b{width:34px;height:34px;border-radius:50%;border:2px solid #777;display:flex;align-items:center;justify-content:center;flex:none}
.ballot .r.hl{background:#fff4cf;outline:3px solid var(--red);outline-offset:-3px}
.ballot .r.hl b{background:var(--red);color:#fff;border-color:var(--red)}
.ballot .r.ghost{color:#9a9a9a}
.steps{max-width:520px;margin:0 auto;padding-inline-start:22px}
.note{color:var(--mut);font-size:13px;text-align:center;margin-top:12px}
footer{background:var(--gd);color:#fff;text-align:center;padding:30px 18px;border-top:4px solid var(--gl)}
footer b{display:block;font:700 26px Amiri,serif;color:var(--gl)}
.sbar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--gd);border-top:2px solid var(--gl)}
.sbar a,.sbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;border:0;background:var(--gl);color:var(--gd);font:700 15px Cairo,sans-serif;text-decoration:none;cursor:pointer}
.sbar .wa{background:#25a15a;color:#fff}
</style>

  voteNote: "الصورة رسم توضيحي فقط، وقد يختلف شكل الورقة الرسمية. راجع تعليمات السلطة الوطنية المستقلة للانتخابات.",
  shareText: "أحمد ستي — الحزب رقم 1 · المترشح رقم 18. معاً من أجل تنمية محلية مستدامة"
};

const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const I={
 building:"M4 21V8l8-5 8 5v13M9 21v-6h6v6M4 21h16",road:"M8 21 10 3M16 21 14 3M12 5v3M12 11v3M12 17v3",
 users:"M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3.5 3-6 6-6s6 2.5 6 6M17 9a2.5 2.5 0 100-5M18 14c2 .5 3 2.5 3 5",
 health:"M12 5v14M5 12h14",leaf:"M5 19C5 9 11 5 19 5c0 8-4 14-14 14zM5 19 13 11",
 eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z",
 phone:"M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z",
 chat:"M4 5h16v11H9l-5 4z",mail:"M3 6h18v12H3zM3 7l9 7 9-7",pin:"M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11zM12 12a2 2 0 100-4 2 2 0 000 4z",
 share:"M18 8a3 3 0 100-6 3 3 0 000 6zM6 15a3 3 0 100-6 3 3 0 000 6zM18 22a3 3 0 100-6 3 3 0 000 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4"};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${I[n]}"/></svg>`;
document.title=C.name+" — "+C.role+" · "+C.area;
$("party").textContent=C.party; $("name").textContent=C.name; $("role").textContent=C.role; $("area").textContent=C.area;
$("pn").textContent=C.partyNumber; $("cn").textContent=C.candidateNumber; $("slogan").textContent=C.slogan; $("promise").textContent=C.promise;
$("photo").src=C.photo;$("banner").src=C.banner;$("idimg").src=C.idImage; $("photo").alt=C.name; $("about-t").textContent=C.about;
$("logo").innerHTML=C.logo?`<img src="${esc(C.logo)}" alt="شعار ${esc(C.party)}">`:"شعار الحزب";if(C.logo){$("logo").style.border="2px solid var(--gl)";$("logo").style.width=$("logo").style.height="76px"}
$("prog").innerHTML=C.program.map(p=>`<div class="card"><div class="ico">${svg(p.icon)}</div><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`).join("");
$("gal").innerHTML=(C.gallery.length?C.gallery:[1,2,3,4,5,6].map(n=>({src:"",alt:"صورة "+n}))).map(g=>
 `<button type="button" data-src="${esc(g.src)}" aria-label="${esc(g.alt)}">${g.src?`<img loading="lazy" src="${esc(g.src)}" alt="${esc(g.alt)}">`:esc(g.alt)}</button>`).join("");
$("gal").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.src){$("lb").querySelector("img").src=b.dataset.src;$("lb").classList.add("on")}};
$("lb").onclick=()=>$("lb").classList.remove("on");
addEventListener("keydown",e=>{if(e.key==="Escape")$("lb").classList.remove("on")});
$("newsl").innerHTML=C.news.map((a,i)=>`<article class="card art" id="a${i}">${a.image?`<img loading="lazy" src="${esc(a.image)}" alt="">`:""}<time>${esc(a.date)}</time><h3>${esc(a.title)}</h3><div class="more"><p>${esc(a.text)}</p></div><button type="button" data-i="${i}">قراءة المزيد</button></article>`).join("");
$("newsl").onclick=e=>{const b=e.target.closest("button");if(b){const a=$("a"+b.dataset.i);a.classList.toggle("open");b.textContent=a.classList.contains("open")?"إخفاء":"قراءة المزيد"}};
const k=C.contact, digits=s=>String(s).replace(/\D/g,"");
const nat=String(k.phone).replace(/^\+213/,"0").replace(/(\d{4})(\d{2})(\d{2})(\d{2})$/,"$1 $2 $3 $4");
const links=[[k.phone?`اتصال <bdi dir="ltr">${nat}</bdi>`:"اتصال","phone",k.phone&&"tel:"+k.phone],["واتساب","chat",k.whatsapp&&"https://wa.me/"+digits(k.whatsapp)],["تيليغرام","",k.telegram&&"https://t.me/"+k.telegram],["فيسبوك","",k.facebook],["إنستغرام","",k.instagram],["تيك توك","",k.tiktok],["بريد إلكتروني","mail",k.email&&"mailto:"+k.email]];
$("cg").innerHTML=links.map(l=>`<a href="${l[2]?esc(l[2]):"#contact"}" ${l[2]?'rel="noopener"':'class="todo" aria-disabled="true"'}>${l[0]}</a>`).join("");
$("addr").innerHTML=svg("pin").replace("<svg",'<svg style="width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:2;vertical-align:middle;margin-inline-end:6px"')+esc(k.address)+(k.map?` — <a href="${esc(k.map)}" style="color:var(--acc);font-weight:700">الموقع على الخريطة</a>`:"");
$("vp").textContent=C.partyNumber;$("vpn").textContent=C.party;$("vc").textContent=C.candidateNumber;$("vcn").textContent=C.name;
$("steps").innerHTML=C.voteSteps.map(s=>`<li>${esc(s.replace("{P}",C.partyNumber).replace("{C}",C.candidateNumber).replace("{PARTY}",C.party))}</li>`).join("");
$("vnote").textContent=C.voteNote;
$("fn").textContent=C.name;$("fs").textContent=C.promise+" — "+C.partyTagline;$("fe").textContent=C.election;
async function share(){const d={title:C.name,text:C.shareText,url:location.href};
 try{if(navigator.share){await navigator.share(d)}else{await navigator.clipboard.writeText(C.shareText+" "+location.href);alert("تم نسخ الرابط")}}catch(e){}}
$("sbar").innerHTML=`<a href="${k.phone?esc("tel:"+k.phone):"#contact"}">اتصال</a><a class="wa" href="${k.whatsapp?esc("https://wa.me/"+digits(k.whatsapp)):"#contact"}">واتساب</a><button type="button" id="sh">شارك</button>`;
$("sh").onclick=share;
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="tel:"]');if(!a)return;e.preventDefault();
 try{(window.top||window).location.href=a.href}catch(x){try{location.href=a.href}catch(y){}}
 try{navigator.clipboard.writeText(k.phone)}catch(x){}
 let m=$("toast");if(!m){m=document.createElement("div");m.id="toast";m.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#08331d;color:#fff;border:1px solid #e3c06a;border-radius:12px;padding:10px 16px;font:700 15px Cairo,sans-serif;z-index:60";document.body.appendChild(m)}
 m.innerHTML='الرقم: <bdi dir="ltr">'+nat+'</bdi> (تم نسخه)';m.style.display="block";setTimeout(()=>m.style.display="none",4000)});

const R=document.documentElement;
try{const t=localStorage.getItem("theme");if(t)R.dataset.theme=t}catch(e){}
$("theme").onclick=()=>{const dark=R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
 R.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",R.dataset.theme)}catch(e){}};
